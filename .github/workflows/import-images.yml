# One-time helper: copies the photos and video from the old sites.ua.edu
# site into static/images/ so the new site no longer depends on it.
# Run it from the Actions tab > "Import images from old site" > Run workflow.
# Afterwards, run "Build and deploy website" once so the site uses the copies.
name: Import images from old site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download images listed in content/
        run: python scripts/fetch_images.py

      - name: Commit the downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/images
          if git diff --cached --quiet; then
            echo "No new images to commit."
          else
            git commit -m "Import images from the old ENABLE Lab site"
            git push
          fi
