# ------------------------------------------------------------------
# Education and outreach. Add new events at the TOP of `events`.
#   kind: K-12 outreach | Student research | Award | Showcase
#   participants: (optional) number of people reached
#   images: src + alt. Please describe who/what is in each photo.
# ------------------------------------------------------------------

intro: >-
  We share wearable technologies, robotics, autonomous systems, and controls with K-12 students, the UA community, and the public, and we involve undergraduates in our research. Schools and
  groups can request a lab tour or STEM demonstration.

programs:
  - name: K-12 lab tours and STEM demonstrations
    text: Hands-on demonstrations of wearable robots and biosignal sensing, including MATHCOUNTS STEM demos and visits to our lab in SERC.
  - name: Engineering open houses
    text: Lab members represent the ENABLE Lab at UA E-Day, which introduces students in grades 6–12 to engineering and computer science majors and careers.
  - name: Undergraduate research
    text: Undergraduates join lab projects through the Randall Research Scholars Program, the Blount Scholars Program and senior capstone design, and present at RRS Live and poster fairs.

