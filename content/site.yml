short_name: ENABLE Lab
full_name: Enhanced NeuroRobotics Autonomy and Biomechanical Engineering Lab
university: The University of Alabama
department: Department of Mechanical Engineering
college: College of Engineering

# Used for search engines and link previews. The GitHub Action fills in
# the real address automatically; you only need to change this if you
# move to a custom domain (for example https://enablelab.ua.edu).
url: https://example.github.io/enablelab-website

description: >-
  The ENABLE Lab at The University of Alabama develops wearable robots,
  neuromuscular sensing and personalized control strategies that restore
  mobility for older adults and people with stroke, spinal cord injury and
  multiple sclerosis.

mission: >-
  We develop robotic devices and control strategies that provide
  personalized assistance and help people overcome mobility challenges.

intro:
  - >-
    Our goal is to improve quality of life for older adults and people living
    with mobility deficits caused by stroke, spinal cord injury and multiple
    sclerosis.
  - >-
    The lab brings together biomechanics, neuromuscular modeling and control,
    and human-centered artificial intelligence. We build wearable and
    rehabilitation robots, sense muscle activity with surface EMG and
    ultrasound imaging, and design controllers that adapt assistance to each
    person.

research_areas:
  - name: Wearable technologies
    text: Hip, ankle and hand exoskeletons and soft wearable interfaces.
  - name: Robotics and controls
    text: Adaptive, Lyapunov-based and learning-based control of assistive robots.
  - name: Biomedical devices
    text: Functional electrical stimulation, hybrid cycling and robotic ultrasound.
  - name: Human–robot interaction
    text: Motion intent detection and assistance personalized to each user.
  - name: Artificial intelligence
    text: Reinforcement learning, deep learning and sensor fusion of biosignals.

