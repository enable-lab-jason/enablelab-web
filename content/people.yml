pi:
  name: Qiang (Jason) Zhang, Ph.D.
  slug: qiang-zhang
  role: Principal Investigator
  title: Assistant Professor, Department of Mechanical Engineering
  affiliation: Affiliated Faculty, Department of Chemical and Biological Engineering, The University of Alabama
  photo: https://sites.ua.edu/enablelab/files/2025/11/2411016_BH_162_Qiang_Zhang-1.jpg
  bio:
    - >-
      Dr. Qiang (Jason) Zhang is an Assistant Professor of Mechanical
      Engineering at The University of Alabama, with an affiliated appointment
      in Chemical and Biological Engineering. He founded the ENABLE Lab in 2023.
    - >-
      Before joining UA, he was a postdoctoral fellow in the CLEAR group at the
      joint Department of Biomedical Engineering of the University of North
      Carolina at Chapel Hill and North Carolina State University.
    - >-
      His research covers advanced controls, wearable robotics, human
      biomechanics, neuromuscular modeling and control, and biomedical
      engineering.
  education:
    - Ph.D., Biomedical Engineering, University of North Carolina at Chapel Hill and North Carolina State University
    - M.S., Mechanical Engineering, University of Pittsburgh
    - M.S., Mechatronics Engineering, Wuhan University
    - B.S., Mechanical Engineering, Wuhan University
  service:
    - Associate Editor, IEEE Transactions on Automation Science and Engineering (2026–)
    - Secretary Select, ASME DSCD Mechatronics Technical Committee (2024)
    - Associate Editor, IEEE BioRob 2024
  links:
    email: qiang.zhang@ua.edu
    cv: https://alabama.box.com/s/n8xydjduyz34s6ciingbysml67mmcjz3
    orcid: https://orcid.org/0000-0002-8806-9672
    scholar: https://scholar.google.com/citations?user=FczBCGAAAAAJ&hl=en
    researchgate: https://www.researchgate.net/profile/Qiang-Zhang-37

