    title: Multiple Robotic Platforms for the Development of Control Approaches
    short_title: Robotic platforms for control research
    theme: Robotics and controls
    summary: A Baxter manipulator, a Kinova arm and quadcopters used to develop and test control methods.
    review: true
    description:
      - >-
        Beyond wearable devices, the lab develops and tests control approaches
